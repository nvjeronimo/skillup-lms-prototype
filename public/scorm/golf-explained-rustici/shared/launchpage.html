<!DOCTYPE html>
<!--
  Golf Explained: Rustici Software's "Run-time Basic Calls" SCORM 1.2 golf sample
  (https://scorm.com/scorm-explained/technical-scorm/golf-examples/, CC BY 3.0), downloaded
  9 Nov 2026.

  ADAPTED for the SkillUp prototype (Nelson, 9 Nov 2026): the original launch page, kept as
  launchpage-original.html, only has a Previous / Next / Exit bar. This one adds a course menu
  in a left sidebar, the way Rise and most authoring tools export a whole course. It is there
  to test a SCORM package that has its own sidebar inside our player (Activity group D).
  The SCORM calls are the original ones: status, bookmark, score and session time. One change:
  the package resumes at the bookmark without asking first. The original used confirm(), which
  blocks inside an iframe.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Golf Explained</title>
<script src="scormfunctions.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #1f2a37;
    background: #ffffff;
    display: flex;
    overflow: hidden;
  }
  /* The package's own menu: deliberately not our design system. */
  #menu {
    width: 300px;
    flex: none;
    height: 100%;
    background: #12324a;
    color: #e8eef3;
    display: flex;
    flex-direction: column;
    transition: margin-left 0.2s ease-out;
  }
  body.menu-closed #menu { margin-left: -300px; }
  #menu header { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  #menu h1 { font-size: 18px; line-height: 24px; margin: 0 0 12px; font-weight: 700; color: #fff; }
  .meter { height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; overflow: hidden; }
  .meter span { display: block; height: 100%; width: 0; background: #5ec27a; transition: width 0.2s ease-out; }
  #pct { font-size: 12px; margin-top: 8px; color: #b8c7d3; }
  #menu nav { overflow-y: auto; flex: 1; padding: 8px 0 16px; }
  .section { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8fa5b6; padding: 16px 20px 6px; }
  .page {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 20px; border: 0; background: none; color: inherit;
    font: inherit; font-size: 14px; line-height: 20px; text-align: left; cursor: pointer;
  }
  .page:hover { background: rgba(255,255,255,0.06); }
  .page[aria-current="page"] { background: rgba(255,255,255,0.12); box-shadow: inset 3px 0 0 #5ec27a; color: #fff; }
  .dot { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid #8fa5b6; }
  .page.visited .dot { border-color: #5ec27a; background: #5ec27a; }
  #main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
  #topbar {
    height: 52px; flex: none; display: flex; align-items: center; gap: 12px;
    padding: 0 12px; border-bottom: 1px solid #e3e8ee; background: #fff;
  }
  #toggle {
    width: 40px; height: 40px; border: 0; border-radius: 6px; background: none; cursor: pointer;
    display: grid; place-items: center; color: #12324a;
  }
  #toggle:hover { background: #eef2f6; }
  #pageTitle { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #count { margin-left: auto; font-size: 13px; color: #5b6b7b; white-space: nowrap; }
  #contentFrame { flex: 1; width: 100%; border: 0; display: block; }
  #navDiv {
    height: 56px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-top: 1px solid #e3e8ee; background: #f7f9fb;
  }
  #navDiv button {
    height: 36px; padding: 0 14px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer;
    border: 1px solid #c5d0db; background: #fff; color: #12324a;
  }
  #navDiv button:disabled { opacity: 0.45; cursor: default; }
  #butNext { margin-left: auto; background: #12324a !important; color: #fff !important; border-color: #12324a !important; }
  #scrim { display: none; }
  /* Narrow: the menu becomes a drawer over the content, closed until the hamburger opens it. */
  @media (max-width: 720px) {
    #menu { position: fixed; z-index: 2; left: 0; top: 0; box-shadow: 0 0 24px rgba(0,0,0,0.3); }
    body.menu-closed #menu { margin-left: -320px; }
    body:not(.menu-closed) #scrim { display: block; position: fixed; inset: 0; z-index: 1; background: rgba(0,0,0,0.35); }
  }
  @media (prefers-reduced-motion: reduce) { #menu, .meter span { transition: none; } }
</style>
<script>
  /* content definition: the original page order, now grouped into the menu's sections */
  var sections = [
    { title: "Playing the game", pages: [
      ["Playing/Playing.html", "Play of the game"],
      ["Playing/Par.html", "Par"],
      ["Playing/Scoring.html", "Scoring"],
      ["Playing/OtherScoring.html", "Other scoring systems"],
      ["Playing/RulesOfGolf.html", "The rules of golf"] ] },
    { title: "Etiquette", pages: [
      ["Etiquette/Course.html", "Care for the course"],
      ["Etiquette/Distracting.html", "Avoid distracting others"],
      ["Etiquette/Play.html", "Playing the game"] ] },
    { title: "Handicapping", pages: [
      ["Handicapping/Overview.html", "Handicapping"],
      ["Handicapping/CalculatingHandicap.html", "Calculating a handicap"],
      ["Handicapping/CalculatingScore.html", "Calculating a score"],
      ["Handicapping/Example.html", "A handicapping example"] ] },
    { title: "Having fun", pages: [
      ["HavingFun/HowToHaveFun.html", "How to have fun golfing"],
      ["HavingFun/MakeFriends.html", "Making friends on the course"] ] },
    { title: "Assessment", pages: [
      ["shared/assessmenttemplate.html?questions=Playing&questions=Etiquette&questions=Handicapping&questions=HavingFun", "Final quiz"] ] }
  ];
  var pageArray = [], pageTitles = [];
  for (var s = 0; s < sections.length; s++) {
    for (var p = 0; p < sections[s].pages.length; p++) {
      pageArray.push(sections[s].pages[p][0]);
      pageTitles.push(sections[s].pages[p][1]);
    }
  }

  var currentPage = null;
  var startTimeStamp = null;
  var processedUnload = false;
  var reachedEnd = false;
  var visited = {};

  function narrow() { return window.matchMedia("(max-width: 720px)").matches; }

  function buildMenu() {
    var nav = document.getElementById("nav");
    var index = 0;
    for (var s = 0; s < sections.length; s++) {
      var h = document.createElement("div");
      h.className = "section";
      h.textContent = sections[s].title;
      nav.appendChild(h);
      for (var p = 0; p < sections[s].pages.length; p++) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "page";
        b.id = "page-" + index;
        b.innerHTML = '<span class="dot" aria-hidden="true"></span><span></span>';
        b.lastChild.textContent = sections[s].pages[p][1];
        b.onclick = (function (i) { return function () { currentPage = i; goToPage(); if (narrow()) setMenu(false); }; })(index);
        nav.appendChild(b);
        index++;
      }
    }
  }

  function setMenu(open) {
    document.body.classList.toggle("menu-closed", !open);
    document.getElementById("toggle").setAttribute("aria-expanded", open ? "true" : "false");
  }

  function doStart() {
    buildMenu();
    setMenu(!narrow());
    startTimeStamp = new Date();
    ScormProcessInitialize();

    var completionStatus = ScormProcessGetValue("cmi.core.lesson_status");
    if (completionStatus == "not attempted") {
      ScormProcessSetValue("cmi.core.lesson_status", "incomplete");
    }
    // The original asked "resume?" with confirm(); a course menu resumes at the bookmark.
    var bookmark = ScormProcessGetValue("cmi.core.lesson_location");
    currentPage = bookmark === "" ? 0 : (parseInt(bookmark, 10) || 0);
    var stored = ScormProcessGetValue("cmi.suspend_data");
    if (stored) { stored.split(",").forEach(function (i) { if (i !== "") visited[i] = true; }); }
    goToPage();
  }

  function goToPage() {
    document.getElementById("contentFrame").src = "../" + pageArray[currentPage];
    document.getElementById("butPrevious").disabled = currentPage == 0;
    document.getElementById("butNext").disabled = currentPage == pageArray.length - 1;
    document.getElementById("pageTitle").textContent = pageTitles[currentPage];
    document.getElementById("count").textContent = (currentPage + 1) + " / " + pageArray.length;

    visited[currentPage] = true;
    for (var i = 0; i < pageArray.length; i++) {
      var b = document.getElementById("page-" + i);
      b.classList.toggle("visited", !!visited[i]);
      if (i == currentPage) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    }
    var done = Object.keys(visited).length;
    var pct = Math.round((done / pageArray.length) * 100);
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("pct").textContent = pct + "% complete";

    ScormProcessSetValue("cmi.core.lesson_location", currentPage);
    ScormProcessSetValue("cmi.suspend_data", Object.keys(visited).join(","));

    // as in the original: the course is complete when the last page is reached
    if (currentPage == pageArray.length - 1) {
      reachedEnd = true;
      var status = ScormProcessGetValue("cmi.core.lesson_status");
      if (status != "passed" && status != "failed") ScormProcessSetValue("cmi.core.lesson_status", "completed");
    }
  }

  function doUnload(pressedExit) {
    if (processedUnload == true) { return; }
    processedUnload = true;
    var totalMilliseconds = new Date().getTime() - startTimeStamp.getTime();
    ScormProcessSetValue("cmi.core.session_time", ConvertMilliSecondsToSCORMTime(totalMilliseconds, false));
    if (pressedExit == false && reachedEnd == false) {
      ScormProcessSetValue("cmi.core.exit", "suspend");
    }
    ScormProcessFinish();
  }

  function doPrevious() { if (currentPage > 0) { currentPage--; } goToPage(); }
  function doNext() { if (currentPage < pageArray.length - 1) { currentPage++; } goToPage(); }

  function doExit() {
    ScormProcessSetValue("cmi.core.exit", reachedEnd ? "" : "suspend");
    doUnload(true);
  }

  // called from assessmenttemplate.html with the score as a percentage (original)
  function RecordTest(score) {
    ScormProcessSetValue("cmi.core.score.raw", score);
    ScormProcessSetValue("cmi.core.score.min", "0");
    ScormProcessSetValue("cmi.core.score.max", "100");
    ScormProcessSetValue("cmi.core.lesson_status", score >= 70 ? "passed" : "failed");
  }

  function ConvertMilliSecondsToSCORMTime(ms, blnIncludeFraction) {
    var h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, sec = Math.floor(ms / 1000) % 60;
    if (h > 9999) return "9999:99:99";
    return ZeroPad(h, 4) + ":" + ZeroPad(m, 2) + ":" + ZeroPad(sec, 2) + (blnIncludeFraction ? "." + Math.floor((ms % 1000) / 10) : "");
  }
  function ZeroPad(n, d) { var s = String(n); while (s.length < d) s = "0" + s; return s; }
</script>
</head>
<body onload="doStart();" onbeforeunload="doUnload(false);" onunload="doUnload(false);">
  <aside id="menu" aria-label="Course menu">
    <header>
      <h1>Golf Explained</h1>
      <div class="meter"><span id="bar"></span></div>
      <div id="pct">0% complete</div>
    </header>
    <nav id="nav"></nav>
  </aside>
  <div id="scrim" onclick="setMenu(false)"></div>
  <div id="main">
    <div id="topbar">
      <button type="button" id="toggle" aria-label="Course menu" aria-controls="menu" aria-expanded="true"
        onclick="setMenu(document.body.classList.contains('menu-closed'))">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="pageTitle"></div>
      <div id="count"></div>
    </div>
    <iframe id="contentFrame" title="Course content" src=""></iframe>
    <div id="navDiv">
      <button type="button" id="butPrevious" onclick="doPrevious();">Previous</button>
      <button type="button" id="butExit" onclick="doExit();">Exit</button>
      <button type="button" id="butNext" onclick="doNext();">Next</button>
    </div>
  </div>
</body>
</html>

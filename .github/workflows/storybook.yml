# Storybook, published to GitHub Pages. A push to main rebuilds it when one of the paths
# below changes. workflow_dispatch publishes whatever ref you choose; run it on main to
# publish the current prototype without waiting for such a push.
#
# A Figma token sync is not one of those pushes. tokens.yml squash-merges with the workflow
# GITHUB_TOKEN, and that push does not start this workflow. tokens.yml dispatches it after
# the merge commit is on main.
name: Storybook

on:
  push:
    branches: [main]
    paths:
      - "tokens/**"
      - "stories/**"
      - "components/**"
      - ".storybook/**"
      - "app/globals.css"
      - "app/reset.css"
      - "lib/**"
      - ".github/workflows/storybook.yml"
      - ".github/workflows/tokens.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: ./node_modules/.bin/storybook build --quiet -o storybook-static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4

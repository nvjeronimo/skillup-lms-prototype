# Tokens from Figma. The "Publish tokens" plugin in the SKO Design System opens a pull request
# that changes tokens/figma/variables.json on a tokens/figma-* branch. This job turns it into CSS,
# proves the prototype still builds, says what changes on the page, and merges.
#
# Approval step: today a Figma sync merges as soon as the checks pass. To have someone approve
# first, set the repository variable TOKENS_AUTO_MERGE to "false" (Settings → Secrets and
# variables → Actions → Variables); the pull request then waits for a human merge.
name: Tokens from Figma

on:
  pull_request:
    branches: [main]
    paths:
      - "tokens/**"
      - "scripts/tokens/**"
      - "stories/Foundations.*"
      - "stories/figmaTokens.ts"
      - ".github/workflows/tokens.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tokens-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FIGMA_SYNC: ${{ startsWith(github.head_ref, 'tokens/figma-') && github.event.pull_request.head.repo.full_name == github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # build.mjs needs nothing from node_modules. The commit holds tokens/generated only, on top
      # of the branch as the plugin pushed it: it never carries main's commits, so the push is
      # accepted even when main changed .github/workflows/* since the branch point (github.token
      # may not push workflow changes).
      - name: Generate the CSS and commit it to the sync branch
        if: env.FIGMA_SYNC == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          node scripts/tokens/build.mjs
          git add tokens/generated
          if ! git diff --cached --quiet; then
            git commit -m "tokens: generate CSS from the Figma export"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi

      # Every check below runs on the branch merged with main, here in the runner only (nothing is
      # pushed): a code PR merged since the branch point may have removed a use (re-running this job
      # then releases a held sync) or added one. A conflict only in tokens/generated is settled by
      # building the CSS again from the merged JSON (it is always rebuilt after the merge); any other
      # conflict stops the job.
      - name: Merge main here, for the checks only
        if: env.FIGMA_SYNC == 'true'
        run: |
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$conflicts" ] && ! echo "$conflicts" | grep -qv '^tokens/generated/'; then
              git checkout --ours tokens/generated
              git add tokens/generated
              git commit --no-edit
            else
              git merge --abort || true
              echo "::error::Merging main into this sync branch conflicts in: $(echo $conflicts). Publish again from the plugin, or resolve the merge by hand."
              exit 1
            fi
          fi
          # Two clean textual merges (JSON and CSS) need not give the CSS build.mjs makes from the
          # merged JSON, so the CSS is always built again here. Local only, like the merge.
          node scripts/tokens/build.mjs
          git add tokens/generated
          git diff --cached --quiet || git commit -qm "tokens: CSS for the merged export (runner only)"

      - name: Generate the CSS (pull requests that are not a Figma sync)
        if: env.FIGMA_SYNC != 'true'
        run: node scripts/tokens/build.mjs

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: The generated CSS matches the export (nobody edits tokens/generated by hand)
        run: node scripts/tokens/build.mjs --check

      - name: Token lint
        run: node scripts/check-tokens.mjs
      - name: Types
        run: ./node_modules/.bin/tsc --noEmit
      - name: Lint
        run: ./node_modules/.bin/next lint
      - name: Build the prototype
        run: ./node_modules/.bin/next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: What changes on the page
        run: |
          git fetch origin main
          node scripts/tokens/compare.mjs --ref origin/main --markdown > token-report.md
          cat token-report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --body-file token-report.md

      # A sync whose JSON drops a CSS name the code still uses is held, whatever
      # TOKENS_AUTO_MERGE says. The job does not fail; the pull request gets a comment.
      - name: Tokens still used in code
        id: guard
        if: env.FIGMA_SYNC == 'true'
        run: |
          git fetch origin main
          git show origin/main:tokens/figma/variables.json > base-variables.json
          node scripts/tokens/usage.mjs --against tokens/figma/variables.json --base base-variables.json --report guard.md

      - name: Say why the sync is held
        if: steps.guard.outputs.blocked == 'true'
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file guard.md

      - name: Merge the Figma sync
        if: env.FIGMA_SYNC == 'true' && vars.TOKENS_AUTO_MERGE != 'false' && steps.guard.outputs.blocked != 'true'
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch

# Tokens from Figma. The "Publish tokens" plugin in the SKO Design System opens a pull request
# that changes tokens/figma/variables.json on a tokens/figma-* branch. This job turns it into CSS,
# proves the prototype still builds, says what changes on the page, and merges.
#
# Approval step: today a Figma sync merges as soon as the checks pass. To have someone approve
# first, set the repository variable TOKENS_AUTO_MERGE to "false" (Settings → Secrets and
# variables → Actions → Variables); the pull request then waits for a human merge.
name: Tokens from Figma

on:
  pull_request:
    branches: [main]
    paths:
      - "tokens/**"
      - "scripts/tokens/**"
      - "stories/Foundations.*"
      - "stories/figmaTokens.ts"
      - ".github/workflows/tokens.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tokens-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FIGMA_SYNC: ${{ startsWith(github.head_ref, 'tokens/figma-') && github.event.pull_request.head.repo.full_name == github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate the CSS from the Figma export
        run: node scripts/tokens/build.mjs

      - name: Commit the generated CSS to the sync branch
        if: env.FIGMA_SYNC == 'true'
        run: |
          git add tokens/generated
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -m "tokens: generate CSS from the Figma export"
            git push
          fi

      - name: The generated CSS matches the export (nobody edits tokens/generated by hand)
        run: node scripts/tokens/build.mjs --check

      - name: Token lint
        run: node scripts/check-tokens.mjs
      - name: Types
        run: ./node_modules/.bin/tsc --noEmit
      - name: Lint
        run: ./node_modules/.bin/next lint
      - name: Build the prototype
        run: ./node_modules/.bin/next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: What changes on the page
        run: |
          git fetch origin main
          node scripts/tokens/compare.mjs --ref origin/main --markdown > token-report.md
          cat token-report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --body-file token-report.md

      - name: Merge the Figma sync
        if: env.FIGMA_SYNC == 'true' && vars.TOKENS_AUTO_MERGE != 'false'
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
